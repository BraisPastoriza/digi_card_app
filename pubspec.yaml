name: digi_card_app
description: "DigiCard App - Digimon Card Game library and deck builder."
publish_to: 'none'

version: 1.3.0+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Local database
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Key/value settings
  shared_preferences: ^2.3.4

  # Images
  cached_network_image: ^3.4.1

  # Saving an exported deck image to the device gallery
  gal: ^2.3.3

  # Misc
  collection: ^1.19.0
  intl: ^0.20.2

  # Updating the app from its GitHub releases: the installed version, which APK
  # fits the device, checking the download, and handing it to the installer
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  crypto: ^3.0.7
  open_filex: ^5.0.0
  file_picker: ^13.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true

  # Builds AppLocalizations from lib/l10n/*.arb, as configured in l10n.yaml.
  generate: true
